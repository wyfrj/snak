<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Snake Neon</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:#0f0c29;
  background:linear-gradient(135deg,#0f0c29 0%,#1a1040 50%,#24243e 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:monospace;color:#eee;
  touch-action:none;-webkit-tap-highlight-color:transparent;
  user-select:none;
}
#wrap{display:flex;align-items:center;gap:20px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px)}
#gamearea{display:flex;flex-direction:column;align-items:center}
#outer{position:relative;display:inline-block}
canvas{
  border:2px solid #665;border-radius:14px;
  box-shadow:0 0 40px rgba(100,60,255,.2),0 0 80px rgba(100,60,255,.08),inset 0 0 25px rgba(0,0,0,.6);
  max-width:min(440px,calc(100vw - 160px));max-height:min(440px,calc(100vh - 80px));
  width:100%;height:auto;display:block;
}
.overlay{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  font-size:22px;pointer-events:none;
  text-shadow:0 0 10px rgba(0,0,0,.9),0 0 30px rgba(0,0,0,.5);
  transition:opacity .35s ease;
}
.overlay .sub{font-size:13px;color:#aaa}
#hud{display:flex;gap:20px;margin-top:8px;font-size:14px;color:#999;align-items:center}
#hud b{color:#4ade80;font-size:15px}
#combo-el{color:#fbbf24;font-weight:bold;transition:transform .15s}
#combo-el.pop{transform:scale(1.5)}
#level-el{color:#a78bfa;font-weight:bold}
#speedbar{width:100px;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
#speedfill{height:100%;border-radius:3px;transition:width .4s ease,background .4s ease;background:linear-gradient(90deg,#4ade80,#22d3ee)}
#legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;justify-content:center;font-size:10px;color:#777}
.leg{display:flex;align-items:center;gap:3px}
.dot{width:10px;height:10px;border-radius:50%}

#dpad{display:grid;grid-template-areas:". up ." "left ctr right" ". dwn .";gap:5px;justify-items:center}
.dbtn{
  width:60px;height:60px;border-radius:14px;border:2px solid #555;
  background:rgba(255,255,255,.07);color:#fff;font-size:22px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  box-shadow:0 2px 6px rgba(0,0,0,.3);
}
.dbtn:active,.dbtn.pressed{background:rgba(74,222,128,.3);transform:scale(.9);border-color:#4ade80;box-shadow:0 0 14px rgba(74,222,128,.4)}
#dpad-up{grid-area:up}
#dpad-left{grid-area:left}
#dpad-ctr{grid-area:ctr;width:50px;height:50px;font-size:12px;border-color:#666;background:rgba(167,139,250,.1)}
#dpad-ctr:active,#dpad-ctr.pressed{background:rgba(167,139,250,.3);border-color:#a78bfa;box-shadow:0 0 14px rgba(167,139,250,.4)}
#dpad-right{grid-area:right}
#dpad-dwn{grid-area:dwn}
@media(max-width:500px){
  body{flex-direction:column}
  #wrap{flex-direction:column}
  canvas{max-width:min(300px,calc(100vw - 32px));max-height:min(300px,calc(100vh - 240px))}
  #dpad{margin-top:4px}
  .dbtn{width:52px;height:52px;font-size:20px}
  #hud{gap:12px;font-size:12px}
}
</style>
</head>
<body>
<div id="wrap">
  <div id="gamearea">
    <div id="outer">
      <canvas id="game" width="440" height="440"></canvas>
      <div id="overlay"><div id="ovt">Press Space</div><div class="sub">or tap Start to begin</div></div>
    </div>
    <div id="hud">
      <span>Score: <b id="score">0</b></span>
      <span id="combo-el"></span>
      <span>Lv.<b id="level-el">1</b></span>
      <div id="speedbar"><div id="speedfill" style="width:30%"></div></div>
    </div>
    <div id="legend">
      <span class="leg"><span class="dot" style="background:#ef4444;box-shadow:0 0 5px #ef4444"></span>+10</span>
      <span class="leg"><span class="dot" style="background:#fbbf24;box-shadow:0 0 5px #fbbf24"></span>+50 gold</span>
      <span class="leg"><span class="dot" style="background:#a78bfa;box-shadow:0 0 5px #a78bfa"></span>+30 shrink</span>
      <span class="leg"><span class="dot" style="background:#22d3ee;box-shadow:0 0 5px #22d3ee"></span>+40 magnet</span>
      <span class="leg"><span class="dot" style="background:#fb923c;box-shadow:0 0 5px #fb923c"></span>+20 armor</span>
    </div>
  </div>
  <div id="dpad">
    <button class="dbtn" id="dpad-up">&#9650;</button>
    <button class="dbtn" id="dpad-left">&#9664;</button>
    <button class="dbtn" id="dpad-ctr">&#9654; Start</button>
    <button class="dbtn" id="dpad-right">&#9654;</button>
    <button class="dbtn" id="dpad-dwn">&#9660;</button>
  </div>
</div>

<script>
(function(){
// ─── DOM ──────────────────────────────────────────────────
var canvas = document.getElementById('game');
var ctx    = canvas.getContext('2d');
var scoreEl  = document.getElementById('score');
var overlay  = document.getElementById('overlay');
var ovt      = document.getElementById('ovt');
var comboEl  = document.getElementById('combo-el');
var lvlEl    = document.getElementById('level-el');
var speedFill= document.getElementById('speedfill');

// ─── CONSTANTS ─────────────────────────────────────────────
var GW = 22;       // grid width  (cells)
var GH = 22;       // grid height (cells)
var CL = 20;       // cell size (px)
var SPD = 95;      // game tick (ms)

// ─── GAME STATE ────────────────────────────────────────────
var snake = [];
var dir   = {x:1, y:0};
var nxt   = {x:1, y:0};
var food  = {x:10, y:10, type:'normal', pulse:0, rot:0};
var score = 0;
var running = false;
var gameOver = false;
var tickFrame = 0;
var renderFrame = 0;
var shakeX = 0, shakeY = 0, shakeAmt = 0;

// ─── EFFECTS ───────────────────────────────────────────────
var sparks  = [];  // {x,y,vx,vy,life,col,size}
var sparkles= [];  // ambient sparkles
var fw     = [];   // food wave rings
var pops   = [];   // score popups
var blasts = [];   // big blast particles
var trails = [];   // snake trail
var bgStars= [];   // background stars
var cText  = [];   // combo floating text
var shards = [];   // snake body shards on death
var ripples= [];   // click ripples
var clickSparks=[]; // click spark bursts

// pre-generate bg stars
for(var si=0;si<35;si++) bgStars.push({
  x: Math.random()*GW*CL, y: Math.random()*GH*CL,
  phase: Math.random()*Math.PI*2, spd: 0.3+Math.random()*0.7, r: Math.random()*1.5+0.5
});

// ─── COMBO / POWERUPS ──────────────────────────────────────
var combo = 0;
var cbTimer = 0;
var magnetF = 0;   // frames
var armorF  = 0;   // frames

// ─── FOOD TABLE ────────────────────────────────────────────
var FD = {
  normal:{c:'#ef4444',g:'#f87171',l:'',  pts:10, prob:0.55},
  gold:  {c:'#fbbf24',g:'#f59e0b',l:'★', pts:50, prob:0.08},
  shrink:{c:'#a78bfa',g:'#8b5cf6',l:'✂', pts:30, prob:0.10},
  magnet:{c:'#22d3ee',g:'#06b6d4',l:'⚡',pts:40, prob:0.12},
  armor: {c:'#fb923c',g:'#f97316',l:'◆', pts:20, prob:0.15},
};

// ================================================================
//  INIT
// ================================================================
function init(){
  snake  = [{x:~~(GW/2), y:~~(GH/2)}];
  dir    = {x:1, y:0};
  nxt    = {x:1, y:0};
  score  = 0;
  combo  = 0;
  cbTimer= 0;
  magnetF= 0;
  armorF = 0;
  sparks   = [];
  sparkles = [];
  fw       = [];
  pops     = [];
  blasts   = [];
  trails   = [];
  cText    = [];
  shards   = [];
  ripples  = [];
  clickSparks = [];

  scoreEl.textContent  = '0';
  comboEl.textContent  = '';
  comboEl.className     = '';
  lvlEl.textContent    = '1';
  speedFill.style.width= '30%';
  speedFill.style.background = 'linear-gradient(90deg,#4ade80,#22d3ee)';

  spawnFood();
  gameOver = false;
  running  = false;
  tickFrame = 0;
  renderFrame = 0;
  shakeAmt = 0;

  draw();
  showOv('Press Space', 'or tap Start to begin');
}

// ================================================================
//  FOOD
// ================================================================
function spawnFood(){
  var r = Math.random(), cum = 0, w = 'normal';
  for(var k in FD){
    cum += FD[k].prob;
    if(r < cum){ w = k; break; }
  }
  var tries = 0;
  do{
    food.x    = (Math.random() * GW) | 0;
    food.y    = (Math.random() * GH) | 0;
    food.type = w;
    food.pulse= 0;
    food.rot  = 0;
    if(++tries > 300) break;
  } while(snake.some(function(s){ return s.x === food.x && s.y === food.y; }));

  if(w !== 'normal') launchFoodWave(food.x, food.y, FD[w].g);
}

// ================================================================
//  EFFECT HELPERS
// ================================================================
function launchFoodWave(cx, cy, col){
  fw.push({x:cx*CL+CL/2, y:cy*CL+CL/2, r:CL/2, col:col, life:1});
}

function sparkBurst(x, y, col, n, spd){
  for(var i=0;i<n;i++){
    var a = Math.random() * Math.PI * 2;
    var s = spd * (0.4 + Math.random() * 0.6);
    sparks.push({x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, col:col, sz:1.5+Math.random()*2});
  }
}

function blastRing(x, y, col, n){
  for(var i=0;i<n;i++){
    var a = i/n*Math.PI*2 + Math.random()*0.3;
    var s = 3 + Math.random()*4;
    blasts.push({x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, col:col, sz:2+Math.random()*2});
  }
}

function popScore(x, y, text, col){
  pops.push({x:x, y:y, text:text, col:col, life:1, vy:-1.8});
}

  function shatterSnake(){
    var HD = 15;
    shards = [];
    for(var i = 0; i < snake.length; i++){
      var s  = snake[i];
      var t  = i / Math.max(snake.length - 1, 1);
      var rv = (150 - t * 95) | 0;
      var gv = (240 - t * 120) | 0;
      var bv = (170 - t * 95) | 0;
      var nShards = 3 + ((Math.random() * 4) | 0);
      for(var j = 0; j < nShards; j++){
        shards.push({
          x:    s.x * CL + CL / 2 + (Math.random() - 0.5) * CL * 1.2,
          y:    s.y * CL + CL / 2 + (Math.random() - 0.5) * CL * 1.2,
          vx:   (Math.random() - 0.5) * 5,
          vy:   -1.5 - Math.random() * 4 - i * HD * 0.15,
          life: 1,
          rot:  Math.random() * Math.PI * 2,
          rotV: (Math.random() - 0.5) * 0.4,
          col:  'rgb(' + rv + ',' + gv + ',' + bv + ')',
          sz:   4 + Math.random() * 6,
          grav: 0.1 + Math.random() * 0.08,
          glow: true
        });
      }
    }
    // extra explosion sparks from center
    sparkBurst(canvas.width / 2, canvas.height / 2, '#86efac', 20, 4);
  }

function clickRipple(x, y){
  ripples.push({x:x, y:y, r:0, col:'#a78bfa', life:1});
  // sparks
  for(var i=0;i<8;i++){
    var a = Math.random()*Math.PI*2;
    var sp = 1.5 + Math.random()*2;
    clickSparks.push({
      x:x, y:y,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      life:1, col:['#a78bfa','#22d3ee','#fbbf24','#86efac'][(Math.random()*4)|0],
      sz:1.5+Math.random()*2
    });
  }
}

function comboFloat(txt, col){
  cText.push({x:canvas.width/2 + (Math.random()-0.5)*80, y:canvas.height/3, txt:txt, col:col, life:1, vy:-1.2});
}

function shake(amt){ shakeAmt = Math.max(shakeAmt, amt); }

// ================================================================
//  STAR SHAPE
// ================================================================
function drawStar(cx, cy, outerR, innerR, spikes){
  ctx.beginPath();
  for(var i=0;i<spikes*2;i++){
    var a = i/(spikes*2)*Math.PI*2 - Math.PI/2;
    var r = (i%2===0) ? outerR : innerR;
    var px = cx + Math.cos(a)*r;
    var py = cy + Math.sin(a)*r;
    i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
  }
  ctx.closePath();
}

// ================================================================
//  DRAW BACKGROUND
// ================================================================
function drawBg(){
  var W=canvas.width, H=canvas.height;

  // shake transform
  var __shook = false;
  if(shakeAmt > 0.3){
    ctx.save();
    ctx.translate((Math.random()-0.5)*shakeAmt*2.5, (Math.random()-0.5)*shakeAmt*2.5);
    shakeAmt *= 0.82;
    __shook = true;
  }

  // gradient bg
  var bg = ctx.createRadialGradient(W/2, H/2, 10, W/2, H/2, W*0.72);
  bg.addColorStop(0, '#1e1545');
  bg.addColorStop(0.5, '#130e38');
  bg.addColorStop(1, '#0a0820');
  ctx.fillStyle = bg;
  ctx.fillRect(-5, -5, W+10, H+10);

  // subtle grid
  ctx.strokeStyle = 'rgba(180,160,255,0.04)';
  ctx.lineWidth = 1;
  for(var i=0;i<=GW;i++){
    ctx.beginPath(); ctx.moveTo(i*CL+0.5, 0); ctx.lineTo(i*CL+0.5, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i*CL+0.5); ctx.lineTo(W, i*CL+0.5); ctx.stroke();
  }

  // twinkling bg stars
  bgStars.forEach(function(s){
    var twinkle = 0.5 + 0.5 * Math.sin(renderFrame * 0.02 * s.spd + s.phase);
    ctx.globalAlpha = twinkle * 0.35;
    ctx.fillStyle = '#c8c8ff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // sparkles (ambient)
  sparkles.forEach(function(sp){
    ctx.globalAlpha = sp.life * 0.6;
    ctx.fillStyle = sp.col;
    ctx.beginPath();
    ctx.arc(sp.x|0, sp.y|0, sp.sz, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // food wave rings (behind everything)
  fw.forEach(function(r){
    ctx.globalAlpha = r.life * 0.18;
    ctx.strokeStyle = r.col;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI*2);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;

  // particles (behind snake)
  sparks.forEach(function(p){
    if(p.life < 0.15) return;
    ctx.globalAlpha = p.life * 0.5;
    ctx.fillStyle = p.col;
    ctx.fillRect((p.x|0) - (p.sz|0), (p.y|0) - (p.sz|0), p.sz*2, p.sz*2);
  });
  ctx.globalAlpha = 1;

  // blasts
  blasts.forEach(function(p){
    ctx.globalAlpha = p.life * 0.7;
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(p.x|0, p.y|0, p.sz * p.life, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // trail
  trails.forEach(function(t){
    ctx.globalAlpha = t.life * 0.3;
    ctx.fillStyle = t.col;
    ctx.beginPath();
    ctx.arc(t.x|0, t.y|0, 2.5 * t.life, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // click ripples
  ripples.forEach(function(r){
    ctx.globalAlpha = r.life * 0.25;
    ctx.strokeStyle = r.col;
    ctx.lineWidth = 2 * r.life;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r * (1 - r.life) * 3, 0, Math.PI*2);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;

  // click sparks
  clickSparks.forEach(function(p){
    ctx.globalAlpha = p.life * 0.7;
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(p.x|0, p.y|0, p.sz * p.life, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // shards (snake body pieces falling)
  shards.forEach(function(s){
    ctx.globalAlpha = Math.max(0, s.life);
    ctx.fillStyle = s.col;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    ctx.fillRect(-s.sz/2, -s.sz/2, s.sz, s.sz);
    ctx.restore();
  });
  ctx.globalAlpha = 1;

  if(__shook) ctx.restore();
  renderFrame++;
}

// ================================================================
//  DRAW FOOD
// ================================================================
function drawFood(){
  var fx = food.x * CL + CL / 2;
  var fy = food.y * CL + CL / 2;
  var f  = FD[food.type];

  food.pulse += 0.12;
  food.rot   += 0.04;

  var pulse = 1 + Math.sin(food.pulse) * 0.15;
  var glow  = 10 + Math.sin(food.pulse * 0.7) * 4;

  if(food.type === 'normal'){
    // pulsing orb
    ctx.save();
    ctx.shadowColor = f.g;
    ctx.shadowBlur  = glow;
    ctx.fillStyle   = f.c;
    ctx.beginPath();
    ctx.arc(fx, fy, (CL/2 - 3) * pulse, 0, Math.PI * 2);
    ctx.fill();

    // inner highlight
    ctx.shadowBlur = 0;
    ctx.fillStyle  = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.arc(fx - CL*0.12, fy - CL*0.12, CL*0.15 * pulse, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  } else {
    // spinning star
    ctx.save();
    ctx.translate(fx, fy);
    ctx.rotate(food.rot);
    ctx.shadowColor = f.g;
    ctx.shadowBlur  = glow + 4;
    ctx.fillStyle   = f.c;
    drawStar(0, 0, (CL/2 - 2) * pulse, (CL/2 - 5) * pulse, 5);
    ctx.fill();

    // second layer star (darker, slightly rotated)
    ctx.globalAlpha = 0.4;
    ctx.fillStyle   = 'rgba(255,255,255,0.5)';
    ctx.rotate(Math.PI / 5);
    drawStar(0, 0, (CL/2 - 5) * pulse, (CL/2 - 8) * pulse, 5);
    ctx.fill();
    ctx.restore();

    // rotating ring
    ctx.save();
    ctx.globalAlpha = 0.12 + Math.sin(food.pulse * 0.8) * 0.08;
    ctx.strokeStyle = f.g;
    ctx.lineWidth   = 1.5;
    ctx.shadowColor = f.g;
    ctx.shadowBlur  = 6;
    ctx.beginPath();
    ctx.arc(fx, fy, CL/2 + 3 + Math.sin(food.pulse * 0.5) * 2, food.rot, food.rot + Math.PI * 1.3);
    ctx.stroke();
    ctx.restore();
  }

  // label
  if(f.l){
    ctx.save();
    ctx.font = 'bold 9px monospace';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle    = 'rgba(0,0,0,0.65)';
    ctx.fillText(f.l, fx, fy + 1);
    ctx.fillStyle    = '#fff';
    ctx.fillText(f.l, fx, fy);
    ctx.restore();
  }
}

// ================================================================
//  DRAW SNAKE
// ================================================================
function drawSnake(){
  var len = snake.length;
  snake.forEach(function(s, i){
    var isHead = (i === 0);
    var isTail = (i === len - 1);
    var t      = (len > 1) ? i / (len - 1) : 0;

    // body gradient: bright -> dark
    var rv = (150 - t * 95) | 0;
    var gv = (240 - t * 120) | 0;
    var bv = (170 - t * 95) | 0;
    var col = 'rgb(' + rv + ',' + gv + ',' + bv + ')';

    // subtle squish on turning
    var squishX = isHead && Math.abs(dir.y) > 0 ? 0.85 : 1;
    var squishY = isHead && Math.abs(dir.x) > 0 ? 0.85 : 1;

    ctx.save();

    if(isHead){
      ctx.shadowColor = '#86efac';
      ctx.shadowBlur  = 14 + Math.sin(renderFrame * 0.25) * 4;
    } else {
      ctx.shadowColor = col;
      ctx.shadowBlur  = isTail ? 1 : 4;
    }
    ctx.fillStyle = col;

    var px = s.x * CL + 1;
    var py = s.y * CL + 1;
    var pw = CL - 2;
    var ph = CL - 2;

    if(isHead){
      pw = pw * squishX;
      ph = ph * squishY;
      px += (CL - 2 - pw) / 2;
      py += (CL - 2 - ph) / 2;
    } else if(isTail){
      pw -= 2; ph -= 2;
      px += 1; py += 1;
    }

    ctx.fillRect(px, py, pw, ph);

    // armor shimmer
    if(armorF > 0 && isHead){
      ctx.globalAlpha = 0.2 + Math.sin(renderFrame * 0.3) * 0.15;
      ctx.fillStyle   = '#fbbf24';
      ctx.fillRect(s.x*CL+1, s.y*CL+1, CL-2, CL-2);
      ctx.globalAlpha = 1;
    }

    // body connection glow
    if(!isHead && !isTail){
      ctx.globalAlpha = 0.15;
      ctx.fillStyle   = '#86efac';
      ctx.fillRect(s.x*CL+1, s.y*CL+1, CL-2, CL-2);
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    // eyes on head
    if(isHead){
      ctx.fillStyle = '#080510';
      var ex = dir.x === 1 ? 13 : dir.x === -1 ? 3 : 7;
      var ey = dir.y === 1 ? 13 : dir.y === -1 ? 3 : 7;
      // eye offset squish for turning feel
      var offX = dir.y !== 0 ? 1 : 0;
      var offY = dir.x !== 0 ? 1 : 0;
      ctx.fillRect(s.x*CL + ex,          s.y*CL + ey,          3, 3);
      ctx.fillRect(s.x*CL + ex + offX*3, s.y*CL + ey + offY*3,  3, 3);
    }
  });
}

// ================================================================
//  POPUPS & TEXT
// ================================================================
function drawPops(){
  pops.forEach(function(p){
    ctx.globalAlpha = Math.min(1, p.life * 1.2);
    ctx.fillStyle   = p.col;
    ctx.font        = 'bold 14px monospace';
    ctx.textAlign   = 'center';
    ctx.shadowColor = p.col;
    ctx.shadowBlur  = 6;
    ctx.fillText(p.text, p.x, p.y);
    ctx.shadowBlur  = 0;
  });
  ctx.globalAlpha = 1;

  cText.forEach(function(p){
    ctx.globalAlpha = Math.max(0, p.life - 0.3);
    ctx.fillStyle   = p.col;
    ctx.font        = 'bold 18px monospace';
    ctx.textAlign   = 'center';
    ctx.fillText(p.txt, p.x, p.y);
  });
  ctx.globalAlpha = 1;
}

// ================================================================
//  MAIN DRAW
// ================================================================
function draw(){
  drawBg();
  drawFood();
  if(!gameOver) drawSnake();
  drawPops();
}

// ================================================================
//  GAME TICK
// ================================================================
function tick(){
  if(!running || gameOver) return;
  tickFrame++;

  // ── combo countdown ──
  if(combo > 0){
    cbTimer--;
    if(cbTimer <= 0){
      if(combo >= 3) comboFloat(combo + 'x COMBO FADED!', '#fbbf24');
      combo = 0;
      comboEl.textContent = '';
      comboEl.className    = '';
    } else {
      comboEl.textContent = combo + 'x COMBO!';
      comboEl.style.color = 'hsl(' + (55 - combo * 4) + ',95%,65%)';
    }
  }

  // ── magnet ──
  if(magnetF > 0){
    magnetF--;
    if(food.type !== 'normal' && snake.length > 0){
      var dx = food.x - snake[0].x;
      var dy = food.y - snake[0].y;
      var dist = Math.sqrt(dx*dx + dy*dy);
      if(dist > 0.5 && Math.random() < magnetF / 50){
        var stepAmt = 0.4 + 0.15 * Math.sin(tickFrame * 0.15);
        food.x = Math.max(0, Math.min(GW-1, ~~(food.x + dx/dist * stepAmt)));
        food.y = Math.max(0, Math.min(GH-1, ~~(food.y + dy/dist * stepAmt)));
      }
    }
    // magnet visual: pull particles toward food
    var fx=food.x*CL+CL/2, fy=food.y*CL+CL/2;
    if(Math.random() < 0.3)
      sparkles.push({x:fx+(Math.random()-0.5)*CL*1.5, y:fy+(Math.random()-0.5)*CL*1.5, life:0.7, col:'#22d3ee', sz:1.2, vy:0, vx:0});
  }

  // ── armor ──
  if(armorF > 0) armorF--;

  // ── move snake ──
  dir = nxt;
  var hd = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // collision
  if(hd.x < 0 || hd.x >= GW || hd.y < 0 || hd.y >= GH || snake.some(function(s){ return s.x === hd.x && s.y === hd.y; })){
    shake(10);

    if(armorF > 0){
      // survived!
      armorF = 0;
      comboFloat('SHIELD SAVED!', '#fbbf24');
      sparkBurst(canvas.width/2, canvas.height/2, '#fbbf24', 25, 4);
      return; // continue playing!
    }

    gameOver = true;
    running  = false;

    // die - snake shatters into falling body chunks
    shatterSnake();
    blastRing(canvas.width/2, canvas.height/2, '#ef4444', 18);
    sparkBurst(canvas.width/2, canvas.height/2, '#ef4444', 30, 5);
    sparkBurst(canvas.width/2, canvas.height/2, '#fbbf24', 12, 3);
    if(combo > 1) comboFloat(combo + 'x COMBO!', '#fbbf24');
    popScore(canvas.width/2, canvas.height/2 - 10, 'GAME OVER', '#ef4444');
    showOv('Game Over!', 'Press Space or tap Start');
    return;
  }

  snake.unshift(hd);

  // ── trail ──
  if((tickFrame & 1) === 0){
    trails.push({
      x: hd.x * CL + CL / 2,
      y: hd.y * CL + CL / 2,
      life: 1,
      col: armorF > 0 ? '#fbbf24' : '#86efac'
    });
  }

  // ── eat ──
  if(hd.x === food.x && hd.y === food.y) eat();
  else snake.pop();
}

// ================================================================
//  EAT
// ================================================================
function eat(){
  var f    = FD[food.type];
  var fx   = food.x * CL + CL / 2;
  var fy   = food.y * CL + CL / 2;
  var isNormal = (food.type === 'normal');

  // combo
  if(isNormal){
    combo++;
    cbTimer = 200;
    if(combo > 1){
      comboEl.textContent = combo + 'x COMBO!';
      comboEl.className    = 'pop';
      setTimeout(function(){ comboEl.className = ''; }, 180);
    }
    score += f.pts * (1 + Math.min(combo - 1, 9) * 0.5);
  } else {
    score += f.pts;
    combo  = 0;
    comboEl.textContent = '';
  }

  // explosions
  var burstN = isNormal ? 14 : (food.type === 'gold') ? 32 : 20;
  var burstSpd = isNormal ? 2.5 : 4.5;
  sparkBurst(fx, fy, f.g, burstN, burstSpd);
  blastRing(fx, fy, f.g, 12);

  if(isNormal) shake(2.5);
  else if(food.type === 'gold'){ shake(10); sparkBurst(fx, fy, '#fff', 8, 6); }
  else shake(5);

  if(isNormal) launchFoodWave(fx, fy, 'rgba(239,68,68,0.4)');

  // powerups
  if(food.type === 'shrink' && snake.length > 3){
    snake.pop();
    snake.pop();
    popScore(fx, fy - CL/2, '-2', '#a78bfa');
  }
  if(food.type === 'magnet'){ magnetF = 420; comboFloat('MAGNET!', '#22d3ee'); }
  if(food.type === 'armor') { armorF  = 360; comboFloat('ARMOR!',  '#fb923c'); }

  // score pop
  var gain = isNormal ? Math.round(f.pts*(1+Math.min(combo-1,9)*0.5)) : f.pts;
  popScore(fx, fy - CL*0.4, '+' + gain, f.c);

  // level & speed
  var lv = (score / 200 | 0) + 1;
  lvlEl.textContent = lv;
  var sp = Math.min(100, 30 + lv * 6);
  speedFill.style.width  = sp + '%';
  speedFill.style.background = sp > 75 ? 'linear-gradient(90deg,#ef4444,#f87171)' : 'linear-gradient(90deg,#4ade80,#22d3ee)';

  scoreEl.textContent = score;
  spawnFood();
}

// ================================================================
//  INPUT
// ================================================================
function startGame(){
  if(gameOver){
    init(); running = true; hideOv();
  } else if(!running){
    running = true; hideOv();
  } else {
    running = false;
    showOv('Paused', 'Press Space to resume');
  }
}

function turn(dx, dy){
  if(!running) return;
  if(dx === 0 && dy === -1 && dir.y !==  1) nxt = {x:0,  y:-1};
  if(dx === 0 && dy ===  1 && dir.y !== -1) nxt = {x:0,  y:1};
  if(dx === -1 && dy === 0 && dir.x !==  1) nxt = {x:-1, y:0};
  if(dx ===  1 && dy === 0 && dir.x !== -1) nxt = {x:1,  y:0};
}

function showOv(t, s){
  ovt.textContent = t;
  overlay.querySelector('.sub').textContent = s || '';
  overlay.style.opacity = '1';
}
function hideOv(){ overlay.style.opacity = '0'; }

// ── keyboard ──
document.addEventListener('keydown', function(e){
  if(e.code === 'Space'){ e.preventDefault(); startGame(); }
  if(running){
    if(e.code === 'ArrowUp')    { e.preventDefault(); turn(0, -1); }
    if(e.code === 'ArrowDown')  { e.preventDefault(); turn(0,  1); }
    if(e.code === 'ArrowLeft')  { e.preventDefault(); turn(-1, 0); }
    if(e.code === 'ArrowRight') { e.preventDefault(); turn(1,  0); }
  }
});

// ── tap canvas ──
canvas.addEventListener('click', function(e){
  var rect = canvas.getBoundingClientRect();
  var scaleX = canvas.width / rect.width;
  var scaleY = canvas.height / rect.height;
  var mx = (e.clientX - rect.left) * scaleX;
  var my = (e.clientY - rect.top) * scaleY;
  clickRipple(mx, my);
  startGame();
});

// ── swipe ──
var tx0 = 0, ty0 = 0;
canvas.addEventListener('touchstart', function(e){
  tx0 = e.touches[0].clientX;
  ty0 = e.touches[0].clientY;
},{passive:false});
canvas.addEventListener('touchend', function(e){
  if(!running || gameOver) return;
  var dx = e.changedTouches[0].clientX - tx0;
  var dy = e.changedTouches[0].clientY - ty0;
  if(Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
  turn(
    Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : -1) : 0,
    Math.abs(dy) > Math.abs(dx) ? (dy > 0 ? 1 : -1) : 0
  );
},{passive:false});

// ── D-pad ──
function setupBtn(id, dx, dy){
  var b = document.getElementById(id);
  b.addEventListener('touchstart', function(e){
    e.preventDefault();
    b.classList.add('pressed');
  }, {passive:false});
  b.addEventListener('touchend', function(e){
    e.preventDefault();
    b.classList.remove('pressed');
    if(!running) startGame();
    else turn(dx, dy);
  }, {passive:false});
  b.addEventListener('mousedown', function(){
    b.classList.add('pressed');
    if(!running) startGame();
    else turn(dx, dy);
  });
  b.addEventListener('mouseup',   function(){ b.classList.remove('pressed'); });
  b.addEventListener('mouseleave',function(){ b.classList.remove('pressed'); });
}
setupBtn('dpad-up',    0, -1);
setupBtn('dpad-dwn',   0,  1);
setupBtn('dpad-left',  -1,  0);
setupBtn('dpad-right',  1,  0);

// ================================================================
//  START
// ================================================================
setInterval(tick, SPD);

// update all effects (called from fxLoop only)
function updateFx(){
  var i, sp, p, cs, sh;

  if(running && Math.random() < 0.15){
    sparkles.push({
      x: Math.random() * GW * CL, y: Math.random() * GH * CL,
      life: 1, col: ['#fff','#aaf','#afa','#faa'][(Math.random()*4)|0],
      sz: 0.5 + Math.random() * 1.5, vy: -(0.2 + Math.random() * 0.5),
      vx: (Math.random() - 0.5) * 0.3
    });
  }

  for(i=sparkles.length-1;i>=0;i--){ sp=sparkles[i]; sp.x+=sp.vx; sp.y+=sp.vy; sp.life-=0.008; if(sp.life<=0) sparkles.splice(i,1); }
  for(i=sparks.length-1;i>=0;i--){ p=sparks[i]; p.x+=p.vx; p.y+=p.vy; p.vx*=0.94; p.vy*=0.94; p.vy+=0.08; p.life-=0.025; if(p.life<=0) sparks.splice(i,1); }
  for(i=blasts.length-1;i>=0;i--){ p=blasts[i]; p.x+=p.vx; p.y+=p.vy; p.vx*=0.92; p.vy*=0.92; p.life-=0.03; if(p.life<=0) blasts.splice(i,1); }
  for(i=trails.length-1;i>=0;i--){ trails[i].life-=0.045; if(trails[i].life<=0) trails.splice(i,1); }
  if(trails.length>220) trails=trails.slice(-220);
  for(i=pops.length-1;i>=0;i--){ pops[i].y+=pops[i].vy; pops[i].life-=0.018; if(pops[i].life<=0) pops.splice(i,1); }
  for(i=cText.length-1;i>=0;i--){ cText[i].y+=cText[i].vy; cText[i].life-=0.012; if(cText[i].life<=0) cText.splice(i,1); }
  for(i=fw.length-1;i>=0;i--){ fw[i].r+=2.5; fw[i].life-=0.03; if(fw[i].life<=0) fw.splice(i,1); }
  for(i=ripples.length-1;i>=0;i--){ ripples[i].life-=0.022; if(ripples[i].life<=0) ripples.splice(i,1); }
  for(i=clickSparks.length-1;i>=0;i--){ cs=clickSparks[i]; cs.x+=cs.vx; cs.y+=cs.vy; cs.vx*=0.93; cs.vy*=0.93; cs.vy+=0.06; cs.life-=0.03; if(cs.life<=0) clickSparks.splice(i,1); }
  if(shards.length>0){ for(i=shards.length-1;i>=0;i--){ sh=shards[i]; sh.x+=sh.vx; sh.y+=sh.vy; sh.vy+=sh.grav; sh.vx*=0.98; sh.life-=0.006; sh.rot+=sh.rotV; if(sh.life<=0||sh.y>canvas.height+30) shards.splice(i,1); } }
}

// single render loop, always runs
function fxLoop(){ updateFx(); draw(); requestAnimationFrame(fxLoop); }

init();
draw();
// start fx loop
fxLoop();
})();
</script>
</body>
